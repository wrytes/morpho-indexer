<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Morpho Markets — Screener</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f1f0ec;
    --text: #0b0b0b;
    --text-2: #52514e;
    --text-3: #898781;
    --line: #e1e0d9;
    --accent: #2a78d6;
    --accent-bg: rgba(42, 120, 214, 0.12);
    --good: #0a8a0a;
    --warn: #b87500;
    --bad: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #121211;
      --surface: #1a1a18;
      --surface-2: #232321;
      --text: #f1f0ec;
      --text-2: #b3b1a9;
      --text-3: #7d7b74;
      --line: #2e2e2b;
      --accent: #5aa0f0;
      --accent-bg: rgba(90, 160, 240, 0.16);
      --good: #3ccf6a;
      --warn: #e8b13a;
      --bad: #f06a6a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: var(--page); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1400px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  .sub { color: var(--text-2); margin: 2px 0 0; }
  .conn { display: flex; gap: 8px; align-items: center; color: var(--text-2); font-size: 12px; }

  input, button, select { font: inherit; color: inherit; }
  input[type=text], input[type=number] { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; width: 100%; }
  button { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { background: var(--surface-2); }
  button:focus-visible, input:focus-visible, th[data-k]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); margin: 0 0 8px; font-weight: 600; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
  .group > .gl { width: 62px; color: var(--text-3); font-size: 11px; }
  .chip { border-radius: 999px; padding: 3px 10px; font-size: 12px; background: var(--surface); }
  .chip[aria-pressed=true] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip .n { color: var(--text-3); font-weight: 400; margin-left: 4px; }
  .mini { font-size: 11px; padding: 1px 7px; color: var(--text-2); }

  .nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .nums label { display: block; color: var(--text-2); font-size: 11px; }
  .nums label input { margin-top: 3px; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 10px; color: var(--text-2); }
  .row label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .prices { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 12px; color: var(--text-2); }
  .prices input { width: 90px; }

  .summary { display: flex; justify-content: space-between; align-items: center; margin: 0 2px 8px; color: var(--text-2); }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; min-width: 1100px; }
  th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child, th.l, td.l { text-align: left; }
  thead th { position: sticky; top: 0; background: var(--surface-2); font-size: 11px; font-weight: 600; color: var(--text-2); user-select: none; }
  th[data-k] { cursor: pointer; }
  th[data-k]:hover { color: var(--text); }
  th .arr { color: var(--accent); margin-left: 3px; }
  tbody tr:hover { background: var(--surface-2); }
  td.pair { font-weight: 600; }
  td.pair a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--text-3); }
  td .sub2 { display: block; font-weight: 400; color: var(--text-3); font-size: 11px; }
  .tag { display: inline-block; font-size: 10px; padding: 0 5px; border-radius: 4px; background: var(--surface-2); color: var(--text-3); margin-left: 5px; font-weight: 500; }
  .stale { color: var(--warn); }
  .good { color: var(--good); }
  .bad { color: var(--bad); }
  .muted { color: var(--text-3); }
  .msg { padding: 28px; text-align: center; color: var(--text-2); }
  .err { color: var(--bad); }
  .foot { color: var(--text-3); font-size: 11px; margin-top: 12px; }
  .foot .bad { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Morpho Markets — Screener</h1>
      <p class="sub">Large / known loan &amp; collateral tokens only. Amounts in ≈USD. Sort by borrow cost, TVL, liquidity…</p>
    </div>
    <div class="conn">
      <span id="status">connecting…</span>
      <input id="endpoint" type="text" style="width: 230px" aria-label="Indexer endpoint" />
      <button id="reload">Reload</button>
    </div>
  </header>

  <div class="panel">
    <div class="cols">
      <div>
        <h2>Loan token (what you borrow)</h2>
        <div id="loanChips"></div>
      </div>
      <div>
        <h2>Collateral token</h2>
        <div id="collChips"></div>
      </div>
    </div>
    <div class="row">
      <label><input type="checkbox" id="knownOnly" checked /> Known tokens only (both sides)</label>
      <span class="muted">No chip selected = all known tokens on that side.</span>
    </div>
  </div>

  <div class="panel">
    <h2>Filters</h2>
    <div class="nums">
      <label>Min TVL ($)<input type="number" id="minTvl" min="0" step="any" /></label>
      <label>Max TVL ($)<input type="number" id="maxTvl" min="0" step="any" /></label>
      <label>Min liquidity ($)<input type="number" id="minLiq" min="0" step="any" /></label>
      <label>Min utilization (%)<input type="number" id="minUtil" min="0" max="100" step="any" /></label>
      <label>Max utilization (%)<input type="number" id="maxUtil" min="0" max="100" step="any" /></label>
      <label>Max borrow APY (%)<input type="number" id="maxBorrow" min="0" step="any" /></label>
      <label>Min supply APY (%)<input type="number" id="minSupply" min="0" step="any" /></label>
      <label>Min LLTV (%)<input type="number" id="minLltv" min="0" max="100" step="any" /></label>
      <label>Active within (days)<input type="number" id="activeDays" min="0" step="any" /></label>
    </div>
    <div class="row">
      <label><input type="checkbox" id="hideEmpty" checked /> Hide markets with no supply</label>
      <label><input type="checkbox" id="onlyBorrowable" /> Only borrowable (liquidity &gt; $1)</label>
      <label><input type="checkbox" id="onlyBadDebt" /> Had bad debt</label>
      <span style="flex:1"></span>
      <button class="mini" data-preset="cheap">Preset: cheap &amp; liquid</button>
      <button class="mini" data-preset="tiny">Preset: tiny TVL</button>
      <button class="mini" data-preset="reset">Reset</button>
    </div>
    <div class="row">
      <div class="prices">
        <span>≈ USD prices for loan tokens:</span>
        <label>BTC <input type="number" id="pBtc" min="0" step="any" /></label>
        <label>ETH <input type="number" id="pEth" min="0" step="any" /></label>
        <label>EUR <input type="number" id="pEur" min="0" step="any" /></label>
        <span id="priceSrc" class="muted"></span>
      </div>
    </div>
  </div>

  <div class="summary"><span id="count"></span><span id="sortInfo"></span></div>
  <div class="tablewrap">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
    <div id="msg" class="msg" hidden></div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script>
(function () {
  'use strict';

  // ---------- known tokens (Ethereum mainnet). Matched by ADDRESS, never by symbol (fake tokens copy symbols). ----------
  // price: 'usd' | 'eur' | 'btc' | 'eth' (+ factor vs. that reference, approximate) — only used to value the LOAN side.
  var TOKENS = [
    // stablecoins
    ['USDC', '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48', 'stable', 'usd'],
    ['USDT', '0xdAC17F958D2ee523a2206206994597C13D831ec7', 'stable', 'usd'],
    ['DAI', '0x6B175474E89094C44Da98b954EedeAC495271d0F', 'stable', 'usd'],
    ['USDS', '0xdC035D45d973E3EC169d2276DDab16f1e407384F', 'stable', 'usd'],
    ['PYUSD', '0x6c3ea9036406852006290770BEdFcAbA0e23A0e8', 'stable', 'usd'],
    ['USDe', '0x4c9EDD5852cd905f086C759E8383e09bff1E68B3', 'stable', 'usd'],
    ['crvUSD', '0xf939E0A03FB07F59A73314E73794Be0E57ac1b4E', 'stable', 'usd'],
    ['GHO', '0x40D16FC0246aD3160Ccc09B8D0D3A2cD28aE6C2f', 'stable', 'usd'],
    ['RLUSD', '0x8292Bb45bf1Ee4d140127049757C2E0fF06317eD', 'stable', 'usd'],
    ['USDtb', '0xC139190F447e929f090Edeb554D95AbB8b18aC1C', 'stable', 'usd'],
    ['EURC', '0x1aBaEA1f7C830bD89Acc67eC4af516284b1bC33c', 'stable', 'eur'],
    // btc
    ['cbBTC', '0xcbB7C0000aB88B473b1f5aFd9ef808440eed33Bf', 'btc', 'btc'],
    ['WBTC', '0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599', 'btc', 'btc'],
    ['tBTC', '0x18084fbA666a33d37592fA2633fD49a74DD93a88', 'btc', 'btc'],
    // eth
    ['WETH', '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2', 'eth', 'eth'],
    // staked / yield-bearing
    ['sDAI', '0x83F20F44975D03b1b09e64809B757c47f942BEeA', 'staked', 'usd', 1.12],
    ['sUSDS', '0xa3931d71877C0E7a3148CB7Eb4463524FEc27fbD', 'staked', 'usd', 1.06],
    ['sUSDe', '0x9D39A5DE30e57443BfF2A8307A4256c8797A3497', 'staked', 'usd', 1.2],
    ['wstETH', '0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0', 'staked', 'eth', 1.2],
    ['stETH', '0xae7ab96520DE3A18E5e111B5EaAb095312D7fE84', 'staked', 'eth'],
    ['weETH', '0xCd5fE23C85820F7B72D0926FC9b05b43E359b7ee', 'staked', 'eth', 1.07],
    ['rETH', '0xae78736Cd615f374D3085123A210448E74Fc6393', 'staked', 'eth', 1.12],
    ['cbETH', '0xBe9895146f7AF43049ca1c1AE358B0541Ea49704', 'staked', 'eth', 1.1],
    ['ezETH', '0xbf5495Efe5DB9ce00f80364C8B423567e58d2110', 'staked', 'eth', 1.04],
    ['rsETH', '0xA1290d69c65A6Fe4DF752f95823fae25cB99e5A7', 'staked', 'eth', 1.05],
    ['sfrxETH', '0xac3E018457B222d93114458476f3E3416Abbe38F', 'staked', 'eth', 1.1],
    ['osETH', '0xf1C9acDc66974dFB6dEcB12aA385b9cD01190E38', 'staked', 'eth', 1.05],
    ['pufETH', '0xD9A442856C234a39a81a089C06451EBAa4306a72', 'staked', 'eth', 1.05],
  ];
  var GROUPS = [['stable', 'Stable'], ['btc', 'BTC'], ['eth', 'ETH'], ['staked', 'Staked']];
  var KNOWN = {}; // lowercase address -> {sym, group, ref, factor}
  TOKENS.forEach(function (t) { KNOWN[t[1].toLowerCase()] = { sym: t[0], group: t[2], ref: t[3], factor: t[4] || 1 }; });

  var DEFAULT_ENDPOINT = 'http://localhost:42069';
  var LS = 'morphoScreener.v1';
  var MAX_ROWS = 500;

  var $ = function (id) { return document.getElementById(id); };
  var state = {
    markets: [],
    loanSel: {}, collSel: {},
    sort: { k: 'borrowApy', dir: 1 },
    showAll: false,
    prices: { btc: 100000, eth: 3500, eur: 1.08 },
  };

  // ---------- persistence ----------
  function load() { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { return {}; } }
  function save() {
    try {
      localStorage.setItem(LS, JSON.stringify({
        endpoint: $('endpoint').value, prices: state.prices, sort: state.sort,
        loanSel: state.loanSel, collSel: state.collSel, knownOnly: $('knownOnly').checked,
      }));
    } catch (e) {}
  }

  // ---------- helpers ----------
  function el(tag, props, children) {
    var n = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === 'text') n.textContent = props[k];
      else if (k === 'class') n.className = props[k];
      else n.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  var nf = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 2 });
  var usd = function (v) { return v == null ? '—' : '$' + nf.format(v); };
  var pct = function (v, d) { return v == null ? '—' : (v * 100).toFixed(d == null ? 2 : d) + '%'; };
  var numVal = function (id) { var v = $(id).value; return v === '' || isNaN(Number(v)) ? null : Number(v); };

  function priceOf(addr) {
    var t = KNOWN[addr];
    if (!t || !t.ref) return null;
    var base = t.ref === 'usd' ? 1 : state.prices[t.ref];
    return base ? base * t.factor : null;
  }

  function ago(sec) {
    if (!sec) return '—';
    var d = Math.max(0, Date.now() / 1000 - sec);
    if (d < 3600) return Math.floor(d / 60) + 'm';
    if (d < 86400) return Math.floor(d / 3600) + 'h';
    if (d < 86400 * 365) return Math.floor(d / 86400) + 'd';
    return (d / 86400 / 365).toFixed(1) + 'y';
  }

  // ---------- chips ----------
  function renderChips(container, sel, side) {
    container.textContent = '';
    GROUPS.forEach(function (g) {
      var toks = TOKENS.filter(function (t) { return t[2] === g[0] && true; });
      if (!toks.length) return;
      var row = el('div', { class: 'group' }, [el('span', { class: 'gl', text: g[1] })]);
      toks.forEach(function (t) {
        var addr = t[1].toLowerCase();
        var b = el('button', { class: 'chip', 'aria-pressed': sel[addr] ? 'true' : 'false', 'data-a': addr, title: t[1] }, [
          document.createTextNode(t[0]), el('span', { class: 'n', 'data-n': side + addr, text: '' }),
        ]);
        row.appendChild(b);
      });
      var all = el('button', { class: 'chip mini', text: 'all', 'data-g': g[0] });
      row.appendChild(all);
      container.appendChild(row);
    });
    container.appendChild(el('button', { class: 'chip mini', text: 'clear', 'data-clear': '1' }));
    container.onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.dataset.a) { sel[b.dataset.a] = !sel[b.dataset.a]; if (!sel[b.dataset.a]) delete sel[b.dataset.a]; }
      else if (b.dataset.g) { TOKENS.forEach(function (t) { if (t[2] === b.dataset.g) sel[t[1].toLowerCase()] = true; }); }
      else if (b.dataset.clear) { Object.keys(sel).forEach(function (k) { delete sel[k]; }); }
      renderChips(container, sel, side); updateChipCounts(); render(); save();
    };
  }
  function updateChipCounts() {
    var cl = {}, cc = {};
    state.markets.forEach(function (m) {
      if (m.supplyUnits > 0) { cl[m.loanToken] = (cl[m.loanToken] || 0) + 1; cc[m.collateralToken] = (cc[m.collateralToken] || 0) + 1; }
    });
    document.querySelectorAll('[data-n]').forEach(function (n) {
      var key = n.dataset.n, side = key.slice(0, key.startsWith('loan') ? 4 : 4), addr = key.slice(4);
      var v = (key.startsWith('loan') ? cl : cc)[addr];
      n.textContent = v ? v : '';
    });
  }

  // ---------- table ----------
  var COLS = [
    { k: 'pair', label: 'Market', cls: 'l', get: function (m) { return m.collSym + '/' + m.loanSym; } },
    { k: 'tvl', label: 'TVL', get: function (m) { return m.tvlUsd; } },
    { k: 'borrowed', label: 'Borrowed', get: function (m) { return m.borrowUsd; } },
    { k: 'liquidity', label: 'Liquidity', get: function (m) { return m.liqUsd; } },
    { k: 'util', label: 'Util', get: function (m) { return m.utilization; } },
    { k: 'borrowApy', label: 'Borrow APY', get: function (m) { return m.borrowApy; } },
    { k: 'supplyApy', label: 'Supply APY', get: function (m) { return m.supplyApy; } },
    { k: 'fee', label: 'Protocol fee', get: function (m) { return m.feePct; } },
    { k: 'lltv', label: 'LLTV', get: function (m) { return m.lltvPct; } },
    { k: 'liq', label: 'Liquidations', get: function (m) { return m.liquidationCount; } },
    { k: 'activity', label: 'Last activity', get: function (m) { return m.lastActivity; } },
    { k: 'created', label: 'Created', get: function (m) { return m.created; } },
  ];

  function buildHead() {
    var tr = $('head'); tr.textContent = '';
    COLS.forEach(function (c) {
      var th = el('th', { 'data-k': c.k, class: c.cls || '', tabindex: '0', role: 'columnheader' });
      th.appendChild(document.createTextNode(c.label));
      if (state.sort.k === c.k) th.appendChild(el('span', { class: 'arr', text: state.sort.dir === 1 ? '▲' : '▼' }));
      tr.appendChild(th);
    });
  }
  function setSort(k) {
    if (state.sort.k === k) state.sort.dir *= -1;
    else state.sort = { k: k, dir: (k === 'pair') ? 1 : (k === 'borrowApy' || k === 'fee') ? 1 : -1 };
    save(); render();
  }
  $('head').addEventListener('click', function (e) { var th = e.target.closest('th[data-k]'); if (th) setSort(th.dataset.k); });
  $('head').addEventListener('keydown', function (e) { if (e.key === 'Enter') { var th = e.target.closest('th[data-k]'); if (th) setSort(th.dataset.k); } });

  function enrich(r) {
    var loan = KNOWN[r.loanToken], coll = KNOWN[r.collateralToken];
    var p = priceOf(r.loanToken);
    var idle = r.collateralToken === '0x0000000000000000000000000000000000000000';
    return {
      raw: r,
      id: r.id, chainId: r.chainId,
      loanToken: r.loanToken, collateralToken: r.collateralToken,
      loanSym: r.loanSymbol, collSym: idle ? 'IDLE' : r.collateralSymbol,
      loanKnown: !!loan, collKnown: !!coll,
      symMismatch: (loan && loan.sym !== r.loanSymbol) || (coll && !idle && coll.sym !== r.collateralSymbol),
      supplyUnits: r.supplyUnits, borrowUnits: r.borrowUnits, liquidityUnits: r.liquidityUnits,
      tvlUsd: p == null ? null : r.supplyUnits * p,
      borrowUsd: p == null ? null : r.borrowUnits * p,
      liqUsd: p == null ? null : r.liquidityUnits * p,
      utilization: r.utilization, borrowApy: r.borrowApy, supplyApy: r.supplyApy,
      feePct: Number(r.fee) / 1e18,
      lltvPct: r.lltvPct,
      liquidationCount: r.liquidationCount,
      badDebt: BigInt(r.badDebtAssets) > 0n,
      lastActivity: Number(r.lastActivityAt),
      lastUpdate: Number(r.lastUpdate),
      created: Number(r.createdAt),
    };
  }

  var ZERO = '0x0000000000000000000000000000000000000000';
  function passes(m) {
    if (m.collateralToken === ZERO) return false; // idle markets (no collateral) are never relevant here
    var known = $('knownOnly').checked;
    var ls = Object.keys(state.loanSel), cs = Object.keys(state.collSel);
    if (ls.length ? !state.loanSel[m.loanToken] : (known && !m.loanKnown)) return false;
    if (cs.length ? !state.collSel[m.collateralToken] : (known && !m.collKnown)) return false;

    if ($('hideEmpty').checked && !(m.supplyUnits > 0)) return false;
    if ($('onlyBorrowable').checked && !(m.liqUsd > 1)) return false;
    if ($('onlyBadDebt').checked && !m.badDebt) return false;

    var v;
    if ((v = numVal('minTvl')) != null && !(m.tvlUsd != null && m.tvlUsd >= v)) return false;
    if ((v = numVal('maxTvl')) != null && !(m.tvlUsd != null && m.tvlUsd <= v)) return false;
    if ((v = numVal('minLiq')) != null && !(m.liqUsd != null && m.liqUsd >= v)) return false;
    if ((v = numVal('minUtil')) != null && m.utilization < v / 100) return false;
    if ((v = numVal('maxUtil')) != null && m.utilization > v / 100) return false;
    if ((v = numVal('maxBorrow')) != null && m.borrowApy > v / 100) return false;
    if ((v = numVal('minSupply')) != null && m.supplyApy < v / 100) return false;
    if ((v = numVal('minLltv')) != null && m.lltvPct < v) return false;
    if ((v = numVal('activeDays')) != null && m.lastActivity < Date.now() / 1000 - v * 86400) return false;
    return true;
  }

  function render() {
    buildHead();
    var col = COLS.filter(function (c) { return c.k === state.sort.k; })[0] || COLS[5];
    var rows = state.markets.filter(passes);
    var dir = state.sort.dir;
    rows.sort(function (a, b) {
      var x = col.get(a), y = col.get(b);
      if (x == null && y == null) return 0;
      if (x == null) return 1; // nulls last regardless of direction
      if (y == null) return -1;
      if (typeof x === 'string') return dir * x.localeCompare(y);
      return dir * (x - y);
    });

    var body = $('body'); body.textContent = '';
    var shown = state.showAll ? rows : rows.slice(0, MAX_ROWS);
    var now = Date.now() / 1000;
    shown.forEach(function (m) {
      var tr = document.createElement('tr');
      function td(content, cls, title) {
        var c = el('td', { class: cls || '' });
        if (typeof content === 'string') c.textContent = content; else if (content) c.appendChild(content);
        if (title) c.title = title;
        tr.appendChild(c); return c;
      }
      // pair + link
      var a = el('a', { href: 'https://app.morpho.org/ethereum/market/' + m.id, target: '_blank', rel: 'noopener', text: m.collSym + ' / ' + m.loanSym });
      var cell = el('td', { class: 'pair l', title: m.id }, [a]);
      if (!m.loanKnown || !m.collKnown) cell.appendChild(el('span', { class: 'tag', text: 'unlisted' }));
      if (m.symMismatch) cell.appendChild(el('span', { class: 'tag bad', text: 'symbol ≠ address!' }));
      tr.appendChild(cell);

      td(usd(m.tvlUsd), '', fmtUnits(m.supplyUnits, m.loanSym));
      td(usd(m.borrowUsd), '', fmtUnits(m.borrowUnits, m.loanSym));
      td(usd(m.liqUsd), '', fmtUnits(m.liquidityUnits, m.loanSym));
      td(pct(m.utilization, 1));
      var stale = now - m.lastUpdate > 86400;
      td(pct(m.borrowApy), stale ? 'stale' : '', stale ? 'Rate is from the last accrual ' + ago(m.lastUpdate) + ' ago — may be outdated' : 'Last accrual ' + ago(m.lastUpdate) + ' ago');
      td(pct(m.supplyApy), stale ? 'stale' : '');
      td(pct(m.feePct, 1), 'muted');
      td(m.lltvPct.toFixed(1) + '%');
      td(m.liquidationCount ? String(m.liquidationCount) + (m.badDebt ? ' ⚠' : '') : '–', m.badDebt ? 'bad' : 'muted', m.badDebt ? 'Realized bad debt' : '');
      td(ago(m.lastActivity), 'muted');
      td(ago(m.created), 'muted');
      body.appendChild(tr);
    });

    $('count').textContent = rows.length + ' of ' + state.markets.length + ' markets' + (shown.length < rows.length ? ' (showing ' + shown.length + ')' : '');
    $('sortInfo').textContent = 'Sorted by ' + col.label + ' ' + (dir === 1 ? '↑' : '↓');
    var msg = $('msg');
    if (!state.markets.length) { msg.hidden = false; }
    else if (!rows.length) { msg.hidden = false; msg.textContent = 'No markets match these filters.'; msg.className = 'msg'; }
    else msg.hidden = true;

    if (shown.length < rows.length) {
      var more = el('tr', {}, [el('td', { colspan: String(COLS.length), class: 'l' }, [el('button', { text: 'Show all ' + rows.length + ' rows', id: 'showAll' })])]);
      body.appendChild(more);
      $('showAll').onclick = function () { state.showAll = true; render(); };
    }
  }
  function fmtUnits(v, sym) { return new Intl.NumberFormat('en-US', { maximumFractionDigits: 4 }).format(v) + ' ' + sym; }

  // ---------- data ----------
  async function loadMarkets() {
    var base = $('endpoint').value.replace(/\/+$/, '');
    $('status').textContent = 'loading…'; $('status').className = '';
    try {
      var all = [], offset = 0, limit = 1000;
      for (;;) {
        var res = await fetch(base + '/markets?limit=' + limit + '&offset=' + offset + '&sort=createdAt&order=asc');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var data = await res.json();
        all = all.concat(data.markets);
        if (data.markets.length < limit) break;
        offset += limit;
      }
      state.markets = all.map(enrich);
      var st = '';
      try {
        var s = await (await fetch(base + '/status')).json();
        st = Object.keys(s).map(function (k) { return k + ' @ ' + s[k].block.number.toLocaleString(); }).join(', ');
      } catch (e) {}
      $('status').textContent = all.length + ' markets' + (st ? ' · ' + st : '');
      renderFoot();
      updateChipCounts(); render();
    } catch (e) {
      $('status').textContent = 'failed: ' + e.message; $('status').className = 'err';
      state.markets = []; render();
      var msg = $('msg'); msg.hidden = false; msg.className = 'msg err';
      msg.textContent = 'Could not reach ' + base + ' — is the indexer running (yarn dev)?';
    }
  }
  function renderFoot() {
    var foot = $('foot'); foot.textContent = '';
    var bad = state.markets.filter(function (m) { return m.symMismatch; });
    if (bad.length) {
      var seen = {}; bad.forEach(function (m) { seen[m.loanToken + m.collateralToken] = 1; });
      foot.appendChild(el('span', { class: 'bad', text: '⚠ ' + bad.length + ' market(s) use an allow-listed address whose on-chain symbol differs from my list — double-check the token list in this file.' }));
    }
    foot.appendChild(document.createTextNode('Rates come from the last interest accrual (orange = older than 24h). USD values are approximate: loan-token units × the prices above. Known tokens are matched by address, see TOKENS in this file.'));
  }

  async function loadPrices() {
    try {
      var r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,euro-coin&vs_currencies=usd');
      if (!r.ok) throw 0;
      var j = await r.json();
      if (j.bitcoin && j.ethereum) {
        state.prices.btc = j.bitcoin.usd; state.prices.eth = j.ethereum.usd;
        if (j['euro-coin']) state.prices.eur = j['euro-coin'].usd;
        $('priceSrc').textContent = '(live: CoinGecko)';
      }
    } catch (e) { $('priceSrc').textContent = '(offline defaults — edit manually)'; }
    syncPriceInputs(); reprice();
  }
  function syncPriceInputs() { $('pBtc').value = state.prices.btc; $('pEth').value = state.prices.eth; $('pEur').value = state.prices.eur; }
  function reprice() { state.markets = state.markets.map(function (m) { return enrich(m.raw); }); render(); save(); }

  // ---------- presets & wiring ----------
  var FIELDS = ['minTvl', 'maxTvl', 'minLiq', 'minUtil', 'maxUtil', 'maxBorrow', 'minSupply', 'minLltv', 'activeDays'];
  function setFields(o) { FIELDS.forEach(function (f) { $(f).value = o[f] == null ? '' : o[f]; }); }
  document.querySelectorAll('[data-preset]').forEach(function (b) {
    b.addEventListener('click', function () {
      var p = b.dataset.preset;
      $('onlyBorrowable').checked = false; $('onlyBadDebt').checked = false; $('hideEmpty').checked = true;
      if (p === 'cheap') { setFields({ maxBorrow: 3, minLiq: 50000, activeDays: 30 }); state.sort = { k: 'borrowApy', dir: 1 }; }
      else if (p === 'tiny') { setFields({ maxTvl: 100000, activeDays: 60 }); $('hideEmpty').checked = false; state.sort = { k: 'tvl', dir: 1 }; }
      else { setFields({}); state.sort = { k: 'borrowApy', dir: 1 }; }
      render(); save();
    });
  });
  FIELDS.concat(['knownOnly', 'hideEmpty', 'onlyBorrowable', 'onlyBadDebt']).forEach(function (id) {
    $(id).addEventListener('input', function () { render(); save(); });
  });
  [['pBtc', 'btc'], ['pEth', 'eth'], ['pEur', 'eur']].forEach(function (p) {
    $(p[0]).addEventListener('input', function () { var v = Number($(p[0]).value); if (v > 0) { state.prices[p[1]] = v; reprice(); } });
  });
  $('reload').addEventListener('click', loadMarkets);
  $('endpoint').addEventListener('change', function () { save(); loadMarkets(); });

  // ---------- init ----------
  var saved = load();
  $('endpoint').value = saved.endpoint || DEFAULT_ENDPOINT;
  if (saved.prices) state.prices = saved.prices;
  if (saved.sort) state.sort = saved.sort;
  if (saved.loanSel) state.loanSel = saved.loanSel;
  if (saved.collSel) state.collSel = saved.collSel;
  if (saved.knownOnly === false) $('knownOnly').checked = false;
  syncPriceInputs();
  renderChips($('loanChips'), state.loanSel, 'loan');
  renderChips($('collChips'), state.collSel, 'coll');
  buildHead();
  loadMarkets().then(loadPrices);
  setInterval(loadMarkets, 60000);
})();
</script>
</body>
</html>
